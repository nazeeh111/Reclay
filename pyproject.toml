[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reclay"
version = "0.3.0"
description = "Learn binary blocks and marked-span relocation rules; compile standalone editors"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
dependencies = []

[project.scripts]
reclay = "reclay.cli:main"

[tool.setuptools.package-data]
reclay = ["web/*", "examples/*", "examples/relocation/*"]

[tool.setuptools.packages.find]
include = ["reclay*"]
